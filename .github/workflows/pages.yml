# Deploy the app to GitHub Pages.
#
# There is no build step: the app is index.html, styles.css and the ES modules
# under src/, served as they are. So this uploads the repository itself rather
# than a bundle - `npm run artifact` makes a single-file version for publishing
# as an artifact, which is a different thing for a different place.
#
# The tests run first, and a red test does not deploy. There are two jobs:
# node --test over the modes, the round and the readings, which needs no
# browser and no install, and the browser checks, which install playwright
# and a Chromium and drive the app in it.
#
# One-time setup, which is a settings toggle and not something a workflow can
# do for itself: Settings -> Pages -> Build and deployment -> Source -> GitHub
# Actions. Until that is set, this workflow runs and the deploy step fails.

name: Pages

# Every push runs the tests; only the default branch deploys. The deploy is
# gated by a condition rather than a branch filter because this repository's
# default branch is not called `main`, and a workflow that names the branch
# goes stale the moment that changes.
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # The app in a real Chromium: every check under tests/browser, at the
  # sizes they ask for. These are the ones that have caught layout faults,
  # class names in strings, a tool playing one channel and a handler that
  # threw on every drag - none of which `npm test` can see - and until this
  # job they ran only when somebody remembered to. Beside the unit tests
  # rather than after them, so a red one does not hide the other.
  #
  # Four machines, each taking a quarter of the checks by time rather than
  # by count (scripts/checks.mjs): on one machine they took nineteen
  # minutes, and four of them are half of that. Every shard runs to the end
  # whatever the others do, so one red shard does not hide another's result.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The browser that matches the pinned playwright, and nothing else.
      #
      # Not `--with-deps`. GitHub's Ubuntu image already has every library
      # Chromium needs - the deps step listed each one as "already the
      # newest version" - and the only thing it ever installed was nine
      # extra font packages (Japanese, Chinese, Thai, Cyrillic, Unifont),
      # 22 MB through apt. One run got them from the mirror at 38 kB/s and
      # spent 9 min 32 s on it, while the 300 MB browser came off its CDN in
      # six seconds. Nothing in the app is drawn in those fonts: every
      # symbol it uses (the flat, the menu bars, the arrows, the tick) comes
      # from DejaVu Sans or Inter, and all 43 checks pass with the nine
      # hidden from Chromium. If a future image drops a library, the browser
      # will not start and the run fails saying so - CI makes a skipped
      # check a failure - rather than passing on a missing glyph.
      #
      # Capped, so a download that does stall costs minutes, not the job.
      - run: npx playwright install chromium
        timeout-minutes: 5
      # CI is set on every Actions run, which makes a skipped check a failure
      # rather than a green tick for nothing. The pictures are only written
      # when a check takes one, and only kept when something failed.
      - run: mkdir -p shots && npm run check:browser -- --shard=${{ matrix.shard }}/4
        env:
          HEADROOM_SHOTS: shots
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-shots-${{ matrix.shard }}
          path: shots/
          if-no-files-found: ignore

  deploy:
    needs: [test, browser]
    # One deploy at a time, and a newer one waits rather than cancelling: half
    # a site is worse than an old one. On this job and not the workflow,
    # where it was: there it queued every push's tests behind every other
    # run - fifteen minutes and more behind a deploy, measured - and GitHub
    # keeps one pending run per group, so a second push in that time silently
    # cancelled the first one's tests altogether.
    concurrency:
      group: pages
      cancel-in-progress: false
    # Only the deploy job needs these, so only the deploy job is given them.
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The repository root, which is the site. Everything the page loads
          # is under src/ and styles.css, both of which are in it.
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
