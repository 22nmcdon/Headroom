<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EQ face — drawups</title>
<!--
  Two drawups of the EQ's face, for choosing between. Not the app: a static
  page built out of the app's own stylesheet and its own knob code, so what
  it shows is what the thing would actually look like rather than a sketch
  of it.

      ?face=a   one band at a time, its knobs across the deck
      ?face=b   all six at once, a column each

      ?draw=none   the summed curve alone, as it is today
      ?draw=one    and the selected band's own shape under it
      ?draw=line   and every band's own shape, as lines
      ?draw=fill   and every band's own shape, shaded from the zero line

  Both share what is not in question: the host row outside the chassis, a
  levels bay beside the curve, the analyser's switches on the curve's own
  rule, and the six fat band buttons replaced by a rail. This file goes when
  the face it decided lands.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--cream); padding: 24px; }
  .stage { margin: 0 auto 40px; }

  /* --- furniture these drawups propose ---------------------------------- */

  /* The display row: the curve, and a levels bay beside it, the way the
     compressor and the saturator already do it. */
  /* Not `.eq-display`: that class IS the glass, with a bezel and a fixed
     height, which gave glass inside glass. The other five faces hold a row of
     named bays and let each bay own its panel; this follows them. */
  .eq-meters { display: flex; gap: 14px; align-items: stretch; }
  .eq-bay-curve { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .eq-bay-levels { width: 58px; flex: none; display: flex; flex-direction: column; }
  .eq-meters .plugin-panel { flex: 1 1 auto; min-height: clamp(170px, 26vh, 260px); }
  .eq-meters canvas { display: block; width: 100%; height: 100%; }
  .eq-foot {
    display: flex; justify-content: space-between;
    font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-faint); margin-top: 5px;
  }

  /* Small switches that live on a panel-name rule, where an analyser's own
     furniture belongs. */
  .rule-kit { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
  .rule-kit .eq-ab .ab-btn { padding: 3px 7px; font-size: 8px; letter-spacing: 0.12em; }
  .eq-bay-curve > .panel-name { white-space: normal; overflow: visible; flex-wrap: wrap; }

  /* The band rail: the six bands as one milled strip, coloured to the
     handles on the curve. Replaces six fat buttons on their own row. */
  .eq-rail { display: flex; border-radius: 2px; overflow: hidden;
             box-shadow: 0 0 0 1px var(--cut), 0 1px 0 var(--lift); }
  .rail-btn {
    flex: 1; min-width: 0; border: none; cursor: pointer; text-align: left;
    padding: 4px 8px 5px; display: flex; align-items: baseline; gap: 7px;
    background: linear-gradient(180deg, #4b433d, #352e2b);
    border-left: 3px solid var(--mark);
    font-family: var(--sans);
  }
  .rail-btn + .rail-btn { box-shadow: -1px 0 0 var(--cut); }
  .rail-btn .rail-type { font-size: 9px; letter-spacing: 0.18em; color: var(--ink-soft); }
  .rail-btn .rail-hz { font-size: 9.5px; letter-spacing: 0.06em; color: var(--ink-faint);
                       font-variant-numeric: tabular-nums; }
  .rail-btn.is-on .rail-type { color: var(--mark); }
  .rail-btn.is-on .rail-hz { color: var(--ink-soft); }
  .rail-btn.is-here {
    background: linear-gradient(180deg, #5d544c, #463d39);
    box-shadow: 0 1px 0 var(--lift) inset, -1px 0 0 var(--cut);
  }
  .rail-btn.is-here .rail-type { color: var(--ink); }

  /* A knob that does not apply to this band type: dimmed where it stands,
     never taken away. */
  .knob.is-idle { opacity: 0.3; }

  .eq-deck { display: flex; flex-direction: column; gap: 10px; }
  .eq-deck-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .eq-deck-head .panel-name { margin: 0; }
  .deck-field { display: flex; gap: 7px; align-items: center; }
  .deck-field > span { font-size: 7.5px; letter-spacing: 0.26em; text-transform: uppercase;
                       color: var(--ink-faint); }
  .eq-knobs { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; }
  .eq-set { display: flex; gap: 18px; align-items: center; }

  /* Option B: six columns, each a band. */
  .eq-columns { display: flex; gap: 6px; }
  .eq-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center;
            gap: 7px; padding: 8px 4px 9px; border-radius: 3px;
            background: linear-gradient(180deg, rgba(255,252,247,0.035), transparent);
            box-shadow: 0 0 0 1px var(--cut); border-top: 3px solid var(--mark); }
  .eq-col .knob { --bay: 42px; --read: 11.5px; --tag: 7.5px; }
  .eq-col-name { font-size: 9px; letter-spacing: 0.2em; color: var(--mark); }
  .eq-col .pick-row .pick-btn { padding: 3px 5px; font-size: 7.5px; letter-spacing: 0.08em; }
  .eq-col-on { font-size: 7.5px; letter-spacing: 0.22em; color: var(--ink-faint); }
  .eq-col.is-off { opacity: 0.42; }

  .tag { font: 500 11px var(--sans); letter-spacing: 0.24em; text-transform: uppercase;
         color: var(--text-soft); margin: 0 0 10px; }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<script type="module">
import { dressKnobs } from '../src/lib/knob.js';

const MARKS = ['#a4553f', '#c07f79', '#b08d57', '#8fae6d', '#6f7f63', '#3f8f88'];
const BANDS = [
  { short: 'HP', hz: '55',   on: true  },
  { short: 'LS', hz: '150',  on: true  },
  { short: 'PK', hz: '450',  on: true  },
  { short: 'PK', hz: '2k50', on: true  },
  { short: 'HS', hz: '7k00', on: true  },
  { short: 'LP', hz: '18k',  on: false },
];
const HERE = 3;

const host = `
  <div class="eq-transport eq-host">
    <button class="play-btn" type="button">Play</button>
    <div class="eq-ab" role="group"><button class="ab-btn is-on" type="button">Yours</button><button class="ab-btn" type="button">Target</button></div>
    <label class="field"><span class="field-label">Sample</span>
      <select><option>Full mix</option></select></label>
    <label class="file-btn">Open a file<input type="file"></label>
  </div>`;

const head = `
  <div class="plugin-head">
    <span class="plugin-lamp"></span>
    <span class="plugin-name">Channel EQ</span>
    <span class="plugin-trim">auto gain &minus;2.1 dB</span>
    <span class="plugin-read">+9.4 dB at 3k15 &middot; widest 1.4 oct</span>
  </div>`;

const display = (id) => `
  <div class="eq-meters">
    <div class="eq-bay-curve">
      <span class="panel-name">Curve
        <span class="rule-kit">
          <div class="eq-ab"><button class="ab-btn is-on" type="button">Flat</button><button class="ab-btn" type="button">4.5</button><button class="ab-btn" type="button">Pink</button></div>
          <div class="eq-ab"><button class="ab-btn" type="button">Fast</button><button class="ab-btn is-on" type="button">Med</button><button class="ab-btn" type="button">Slow</button></div>
          <div class="eq-ab"><button class="ab-btn" type="button">Hold</button></div>
        </span>
      </span>
      <div class="plugin-panel"><canvas id="${id}Curve"></canvas></div>
    </div>
    <div class="eq-bay-levels">
      <span class="panel-name">Lvl</span>
      <div class="plugin-panel"><canvas id="${id}Meters"></canvas></div>
      <div class="eq-foot"><span>in</span><span>out</span></div>
    </div>
  </div>`;

const rail = BANDS.map((b, i) => `
  <button class="rail-btn${b.on ? ' is-on' : ''}${i === HERE ? ' is-here' : ''}"
          type="button" style="--mark:${MARKS[i]}">
    <span class="rail-type">${b.short}</span>
    <span class="rail-hz">${b.hz}</span>
  </button>`).join('');

const knob = (name, value, { at = 0.5, idle = false } = {}) => `
  <div class="knob${idle ? ' is-idle' : ''}">
    <span class="knob-name">${name}</span>
    <output class="knob-value">${value}</output>
    <input class="knob-dial" type="range" min="0" max="1" step="0.001" value="${at}" aria-label="${name}">
  </div>`;

/* --- A: one band at a time, knobs across the deck ----------------------- */
const A = `${host}
  <div class="plugin eq">
    ${head}
    ${display('a')}
    <div class="eq-deck">
      <div class="eq-deck-head">
        <span class="panel-name">Band</span>
        <div class="deck-field"><span>Type</span>
          <div class="pick-row">
            ${['HP', 'LS', 'PK', 'HS', 'LP'].map((t) => `<button class="pick-btn" type="button" aria-pressed="${t === 'PK'}">${t}</button>`).join('')}
          </div>
        </div>
        <div class="deck-field"><span>Slope</span>
          <div class="pick-row">
            ${[6, 12, 18, 24, 48].map((s) => `<button class="pick-btn" type="button" aria-pressed="false" disabled>${s}</button>`).join('')}
          </div>
        </div>
      </div>
      <div class="eq-rail">${rail}</div>
      <div class="eq-knobs">
        ${knob('Frequency', '2k50', { at: 0.62 })}
        ${knob('Gain', '+8.0 dB', { at: 0.78 })}
        ${knob('Q', '1.10', { at: 0.42 })}
        ${knob('Slope', '&mdash;', { at: 0.25, idle: true })}
      </div>
    </div>
    <div class="eq-set">
      <label class="toggle"><input type="checkbox" checked> Auto gain <span class="plugin-trim">&minus;2.1 dB</span></label>
      <button class="ab-btn solo-btn" type="button">Solo band</button>
    </div>
  </div>`;

/* --- B: all six at once, a console strip -------------------------------- */
const column = (b, i) => `
  <div class="eq-col${b.on ? '' : ' is-off'}" style="--mark:${MARKS[i]}">
    <span class="eq-col-name">${b.short}</span>
    <div class="pick-row">
      ${['HP', 'LS', 'PK', 'HS', 'LP'].map((t) => `<button class="pick-btn" type="button" aria-pressed="${t === b.short}">${t}</button>`).join('')}
    </div>
    ${knob('Freq', b.hz, { at: 0.2 + i * 0.14 })}
    ${knob(i === 0 || i === 5 ? 'Res' : 'Gain', i === 0 || i === 5 ? '&minus;3.0' : '+0.0', { at: 0.5, idle: false })}
    ${knob(i === 0 || i === 5 ? 'Slope' : 'Q', i === 0 || i === 5 ? '12' : '1.40', { at: 0.4 })}
    <span class="eq-col-on">${b.on ? 'ON' : 'OFF'}</span>
  </div>`;

const B = `${host}
  <div class="plugin eq">
    ${head}
    ${display('b')}
    <div class="eq-deck">
      <span class="panel-name">Bands</span>
      <div class="eq-columns">${BANDS.map(column).join('')}</div>
    </div>
    <div class="eq-set">
      <label class="toggle"><input type="checkbox" checked> Auto gain <span class="plugin-trim">&minus;2.1 dB</span></label>
      <button class="ab-btn solo-btn" type="button">Solo band</button>
    </div>
  </div>`;

const which = new URL(location.href).searchParams.get('face') ?? 'a';
document.getElementById('stage').innerHTML = which === 'b' ? B : A;
dressKnobs(document.body);

/* --- the glass ---------------------------------------------------------- */

function fit(canvas) {
  const box = canvas.getBoundingClientRect();
  const dpr = devicePixelRatio || 1;
  canvas.width = Math.round(box.width * dpr);
  canvas.height = Math.round(box.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, w: box.width, h: box.height };
}

/* The bands this drawup is showing, each with its own shape - so the summed
   curve is genuinely the sum of them rather than a line that looks about
   right. Rough forms, but the right rough forms: a shelf is flat on one side
   and zero on the other, a bell is a bump, a cut is a slope. */
const SHAPES = [
  { i: 0, kind: 'hp', hz: 55,    gain: 0,    order: 4, on: true },
  { i: 1, kind: 'ls', hz: 150,   gain: 7.0,            on: true },
  { i: 2, kind: 'pk', hz: 450,   gain: -6.0, width: 0.34, on: true },
  { i: 3, kind: 'pk', hz: 2500,  gain: 8.0,  width: 0.62, on: true },
  { i: 4, kind: 'hs', hz: 7000,  gain: 5.0,            on: true },
  { i: 5, kind: 'lp', hz: 18000, gain: 0,    order: 2, on: false },
];

function bandAt(band, hz) {
  switch (band.kind) {
    case 'hp': return -10 * Math.log10(1 + (band.hz / hz) ** (2 * band.order));
    case 'lp': return -10 * Math.log10(1 + (hz / band.hz) ** (2 * band.order));
    case 'ls': return band.gain / (1 + (hz / band.hz) ** 2);
    case 'hs': return band.gain / (1 + (band.hz / hz) ** 2);
    default:   return band.gain * Math.exp(-((Math.log2(hz / band.hz)) ** 2) / (2 * band.width ** 2));
  }
}

const sumAt = (hz) => SHAPES.reduce((db, b) => db + (b.on ? bandAt(b, hz) : 0), 0);

function drawCurve(canvas, how) {
  const { ctx, w, h } = fit(canvas);
  const x = (hz) => (Math.log2(hz / 20) / Math.log2(1000)) * w;
  const y = (db) => h / 2 - (db / 18) * (h / 2 - 8);
  const floor = h - 2;

  // the spectrum behind it
  ctx.fillStyle = 'rgba(250,246,240,0.09)';
  ctx.beginPath();
  ctx.moveTo(0, h);
  for (let i = 0; i <= 160; i += 1) {
    const hz = 20 * 1000 ** (i / 160);
    const tilt = -10 * Math.log2(hz / 200);
    const bump = 9 * Math.exp(-((Math.log2(hz / 90)) ** 2) / 0.4)
      + 5 * Math.exp(-((Math.log2(hz / 2400)) ** 2) / 1.2);
    const n = 2.4 * Math.sin(i * 1.7) * Math.sin(i * 0.41);
    ctx.lineTo(x(hz), Math.max(2, h * 0.52 - (tilt + bump + n) * 0.9));
  }
  ctx.lineTo(w, h);
  ctx.fill();

  // grid
  ctx.strokeStyle = 'rgba(250,246,240,0.10)';
  ctx.lineWidth = 1;
  for (const hz of [50, 100, 200, 500, 1000, 2000, 5000, 10000]) {
    ctx.beginPath(); ctx.moveTo(x(hz), 0); ctx.lineTo(x(hz), h); ctx.stroke();
  }
  for (const db of [12, 6, 0, -6, -12]) {
    ctx.beginPath(); ctx.moveTo(0, y(db)); ctx.lineTo(w, y(db)); ctx.stroke();
  }
  ctx.font = '9px Jost, sans-serif';
  ctx.fillStyle = 'rgba(250,246,240,0.34)';
  for (const [hz, label] of [[50, '50'], [100, '100'], [500, '500'], [1000, '1k'], [5000, '5k'], [10000, '10k']]) {
    ctx.fillText(label, x(hz) + 3, h - 5);
  }
  for (const db of [12, 6, -6, -12]) ctx.fillText((db > 0 ? '+' : '') + db, 4, y(db) - 3);

  // what each band is doing on its own
  const walk = (f) => {
    const points = [];
    for (let i = 0; i <= 240; i += 1) {
      const hz = 20 * 1000 ** (i / 240);
      points.push([x(hz), Math.min(floor, y(Math.max(-22, f(hz))))]);
    }
    return points;
  };

  const showing = how === 'one' ? SHAPES.filter((b) => b.i === HERE)
    : how === 'none' ? [] : SHAPES.filter((b) => b.on);

  for (const band of showing) {
    // A band sitting at unity is not in the signal path in any audible sense,
    // and the summed curve already leaves it out. Six flat lines on the zero
    // line are six ways of drawing nothing.
    if (band.kind === 'pk' || band.kind === 'ls' || band.kind === 'hs') {
      if (Math.abs(band.gain) < 0.05) continue;
    }
    const points = walk((hz) => bandAt(band, hz));
    const here = band.i === HERE;

    // Cuts get a line and no shading. What a high-pass contributes goes to
    // minus infinity, so shading the area under it shades most of the
    // display - and the thing it is telling you is where the corner is, not
    // how much floor there is below it.
    const shaded = how !== 'line' && band.kind !== 'hp' && band.kind !== 'lp';
    if (shaded) {
      ctx.beginPath();
      ctx.moveTo(points[0][0], y(0));
      for (const [px, py] of points) ctx.lineTo(px, py);
      ctx.lineTo(points[points.length - 1][0], y(0));
      ctx.closePath();
      ctx.fillStyle = MARKS[band.i] + (here ? '66' : '30');
      ctx.fill();
    }

    ctx.beginPath();
    for (const [i, [px, py]] of points.entries()) { if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
    ctx.strokeStyle = MARKS[band.i] + (here ? 'ff' : 'bb');
    ctx.lineWidth = here ? 1.6 : 1;
    ctx.stroke();
  }

  // the sum, over the top of all of it
  ctx.strokeStyle = '#faf6f0';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  for (const [i, [px, py]] of walk(sumAt).entries()) { if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
  ctx.stroke();

  // the handles
  for (const band of SHAPES) {
    const here = band.i === HERE;
    const py = Math.min(h - 12, Math.max(12, y(Math.max(-16, sumAt(band.hz)))));
    ctx.beginPath();
    ctx.arc(x(band.hz), py, here ? 10 : 7.5, 0, Math.PI * 2);
    ctx.fillStyle = here ? MARKS[band.i] : 'rgba(33,28,26,0.86)';
    ctx.fill();
    ctx.strokeStyle = MARKS[band.i];
    ctx.lineWidth = here ? 2 : 1.4;
    ctx.stroke();
    ctx.fillStyle = here ? '#1a1615' : MARKS[band.i];
    ctx.font = `${here ? 600 : 400} 8.5px Jost, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(BANDS[band.i].short, x(band.hz), py + 3);
    ctx.textAlign = 'left';
  }
}

function drawMeters(canvas) {
  const { ctx, w, h } = fit(canvas);
  const pad = 7;
  const width = (w - pad * 3) / 2;
  for (const [i, level] of [0.72, 0.66].entries()) {
    const x = pad + i * (width + pad);
    ctx.fillStyle = 'rgba(250,246,240,0.07)';
    ctx.fillRect(x, pad, width, h - pad * 2);
    const tall = (h - pad * 2) * level;
    const grad = ctx.createLinearGradient(0, h - pad, 0, pad);
    grad.addColorStop(0, '#6f7f63');
    grad.addColorStop(0.72, '#b08d57');
    grad.addColorStop(1, '#a4553f');
    ctx.fillStyle = grad;
    ctx.fillRect(x, h - pad - tall, width, tall);
    ctx.fillStyle = 'rgba(250,246,240,0.8)';
    ctx.fillRect(x, h - pad - tall - 1.5, width, 1.5);
  }
}

const how = new URL(location.href).searchParams.get('draw') ?? 'fill';
for (const canvas of document.querySelectorAll('canvas')) {
  if (canvas.id.endsWith('Curve')) drawCurve(canvas, how);
  else drawMeters(canvas);
}
</script>
</body>
</html>
